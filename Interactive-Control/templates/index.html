<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Interactive Control</title>
  <style>
    :root { color-scheme: dark; --bg:#101315; --panel:#191e20; --line:#354044; --ink:#e9efed; --muted:#91a09d; --accent:#d6ff62; --danger:#ff806f; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:var(--bg); color:var(--ink); font:15px/1.4 system-ui,sans-serif; }
    header { display:flex; align-items:center; justify-content:space-between; gap:20px; padding:22px 28px; border-bottom:1px solid var(--line); }
    h1 { margin:0; font:600 clamp(22px,3vw,34px)/1 Georgia,serif; letter-spacing:-.03em; }
    .status { color:var(--muted); } .status i { display:inline-block; width:9px; height:9px; margin-right:7px; border-radius:50%; background:var(--danger); } .status.connected i { background:var(--accent); }
    main { display:grid; grid-template-columns:minmax(280px,1fr) 300px; gap:24px; max-width:1280px; margin:0 auto; padding:24px 28px; }
    .stage { min-width:0; } .stage-head { display:flex; justify-content:space-between; margin-bottom:10px; color:var(--muted); font-size:13px; }
    .canvas-frame { width:min(100%,700px); margin:auto; padding:10px; background:#283033; border:1px solid var(--line); }
    canvas { display:block; width:100%; height:auto; aspect-ratio:7/10; background:#fbfaf4; touch-action:none; cursor:crosshair; }
    .hint { margin:12px 0 0; color:var(--muted); font-size:13px; }
    aside { display:flex; flex-direction:column; gap:14px; } .card { padding:18px; background:var(--panel); border:1px solid var(--line); }
    h2 { margin:0 0 14px; color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.14em; }
    label { display:block; margin:10px 0 5px; color:var(--muted); font-size:12px; } input { width:100%; padding:9px; color:var(--ink); background:#111617; border:1px solid var(--line); border-radius:3px; }
    .row { display:flex; gap:8px; } button { flex:1; padding:10px 12px; color:var(--ink); background:#242c2e; border:1px solid var(--line); border-radius:3px; cursor:pointer; } button:hover:not(:disabled) { border-color:var(--accent); color:var(--accent); } button:disabled { opacity:.4; cursor:not-allowed; } .primary { color:#111; background:var(--accent); border-color:var(--accent); }
    .readout { display:grid; grid-template-columns:1fr 1fr; gap:8px; color:var(--muted); font-size:13px; } .readout strong { display:block; color:var(--ink); font-size:18px; font-weight:500; }
    @media (max-width:760px) { header { padding:18px; } main { display:block; padding:18px; } aside { margin-top:20px; } .canvas-frame { padding:6px; } }
  </style>
</head>
<body>
  <header><h1>Interactive Plotter</h1><div class="status" id="status"><i></i>Disconnected</div></header>
  <main>
    <section class="stage">
      <div class="stage-head"><span>DRAWING SURFACE</span><span id="coords">0, 0 mm</span></div>
      <div class="canvas-frame"><canvas id="canvas" width="700" height="1000" aria-label="Plotter drawing area"></canvas></div>
      <p class="hint">Press and drag to draw. The pen lowers only when a line starts and lifts on release.</p>
    </section>
    <aside>
      <section class="card"><h2>Connection</h2>
        <label for="device">Serial device</label><div class="row"><select id="device" style="flex:1"><option value="">Loading devices...</option></select><button id="refresh-devices" type="button" title="Refresh serial devices">Refresh</button></div>
         <label for="pen-up-speed">Pen-up speed (mm/min)</label><input id="pen-up-speed" type="number" min="50" max="8000" value="2000">
         <label for="pen-down-speed">Pen-down speed (mm/min)</label><input id="pen-down-speed" type="number" min="50" max="8000" value="1000">
         <label for="point-spacing">Minimum point spacing (mm)</label><input id="point-spacing" type="number" min="0.1" max="20" step="0.1" value="2">
        <div class="row" style="margin-top:14px"><button class="primary" id="connect">Connect</button><button id="disconnect" disabled>Disconnect</button></div>
      </section>
      <section class="card"><h2>Plotter</h2><div class="readout"><div>BED WIDTH<strong>{{ bed_width }} mm</strong></div><div>BED HEIGHT<strong>{{ bed_height }} mm</strong></div><div>PEN<strong id="pen">up</strong></div><div>POINTER<strong id="pointer">idle</strong></div></div></section>
       <section class="card"><h2>Safety</h2><div class="row"><button id="pen-down" disabled>Pen down</button><button id="lift" disabled>Pen up</button><button id="home" disabled>Home</button></div><button id="clear" style="margin-top:8px">Clear preview</button></section>
    </aside>
  </main>
  <script>
    const canvas = document.querySelector('#canvas'), ctx = canvas.getContext('2d');
    const statusEl = document.querySelector('#status'), penEl = document.querySelector('#pen'), pointerEl = document.querySelector('#pointer');
    const connectBtn = document.querySelector('#connect'), disconnectBtn = document.querySelector('#disconnect'), penDownBtn = document.querySelector('#pen-down'), liftBtn = document.querySelector('#lift'), homeBtn = document.querySelector('#home');
    let connected = false, drawing = false, requestChain = Promise.resolve(), lastSentPoint = null;
    const distanceBetween = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
    ctx.lineWidth = 2; ctx.lineCap = 'round'; ctx.strokeStyle = '#182022';
    const api = (path, body) => fetch(path, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body || {})}).then(async r => { const text = await r.text(); let data; try { data = JSON.parse(text); } catch (_) { throw new Error(`HTTP ${r.status} from ${path}; restart the Flask server`); } if (!r.ok || !data.ok) throw new Error(data.error || `HTTP ${r.status}`); return data; });
    const deviceSelect = document.querySelector('#device');
    async function loadDevices() {
      deviceSelect.disabled = true;
      try {
        const response = await fetch('/api/serial-ports');
        const data = await response.json();
        const previous = deviceSelect.value;
        deviceSelect.replaceChildren();
        if (!data.ports.length) {
          deviceSelect.add(new Option('No serial devices found', ''));
        } else {
          data.ports.forEach(port => deviceSelect.add(new Option(`${port.device} — ${port.description}`, port.device)));
          deviceSelect.value = data.ports.some(port => port.device === previous) ? previous : data.ports[0].device;
        }
      } catch (error) {
        deviceSelect.replaceChildren(new Option('Unable to list devices', ''));
      } finally {
        deviceSelect.disabled = connected;
      }
    }
    function setConnected(value) { connected = value; statusEl.classList.toggle('connected', value); statusEl.lastChild.textContent = value ? 'Connected' : 'Disconnected'; connectBtn.disabled = value; disconnectBtn.disabled = !value; penDownBtn.disabled = !value; liftBtn.disabled = !value; homeBtn.disabled = !value; deviceSelect.disabled = value; }
    function point(event) { const r = canvas.getBoundingClientRect(); const x = Math.max(0, Math.min(1, (event.clientX-r.left)/r.width)); const y = Math.max(0, Math.min(1, (event.clientY-r.top)/r.height)); return {x:x*{{ bed_width }}, y:(1-y)*{{ bed_height }}, screenX:x*canvas.width, screenY:y*canvas.height}; }
    function send(pointData, penDown) { requestChain = requestChain.then(() => api('/api/draw', {x:pointData.x, y:pointData.y, pen_down:penDown, pen_up_speed:Number(document.querySelector('#pen-up-speed').value), pen_down_speed:Number(document.querySelector('#pen-down-speed').value)})).then(data => { penEl.textContent=data.pen; }).catch(err => { pointerEl.textContent=err.message; }); return requestChain; }
    canvas.addEventListener('pointerdown', event => { if (!connected) { pointerEl.textContent='connect first'; return; } event.preventDefault(); canvas.setPointerCapture(event.pointerId); drawing=true; pointerEl.textContent='drawing'; const p=point(event); lastSentPoint=p; ctx.beginPath(); ctx.moveTo(p.screenX,p.screenY); send(p,false); });
    canvas.addEventListener('pointermove', event => { const p=point(event); document.querySelector('#coords').textContent=`${p.x.toFixed(1)}, ${p.y.toFixed(1)} mm`; if (!drawing) return; event.preventDefault(); ctx.lineTo(p.screenX,p.screenY); ctx.stroke(); const spacing=Math.max(0.1, Number(document.querySelector('#point-spacing').value) || 2); if (lastSentPoint && distanceBetween(p, lastSentPoint) < spacing) return; lastSentPoint=p; send(p,true); });
    async function release(event) { if (!drawing) return; const p=point(event); const spacing=Math.max(0.1, Number(document.querySelector('#point-spacing').value) || 2); drawing=false; pointerEl.textContent='idle'; if (canvas.hasPointerCapture(event.pointerId)) canvas.releasePointerCapture(event.pointerId); if (!lastSentPoint || distanceBetween(p, lastSentPoint) >= spacing) { lastSentPoint=p; send(p,true); } requestChain=requestChain.then(() => api('/api/pen-up')).then(() => penEl.textContent='up').catch(err => pointerEl.textContent=err.message); }
    canvas.addEventListener('pointerup', release); canvas.addEventListener('pointercancel', release); canvas.addEventListener('lostpointercapture', () => { if (drawing) { drawing=false; api('/api/pen-up').catch(()=>{}); } });
    connectBtn.onclick = async () => { try { const device = deviceSelect.value; if (!device) throw new Error('Select a serial device first'); await api('/api/connect', {device, pen_up_speed:Number(document.querySelector('#pen-up-speed').value)}); setConnected(true); deviceSelect.disabled=true; } catch(e) { alert(e.message); } };
    disconnectBtn.onclick = async () => { try { await api('/api/disconnect'); setConnected(false); penEl.textContent='up'; } catch(e) { alert(e.message); } };
    liftBtn.onclick = async () => { try { await api('/api/pen-up'); penEl.textContent='up'; } catch(e) { alert(e.message); } };
    penDownBtn.onclick = async () => { try { await api('/api/pen-down'); penEl.textContent='down'; } catch(e) { alert(e.message); } };
    homeBtn.onclick = () => { if (drawing) { pointerEl.textContent='release the pointer first'; return; } requestChain=requestChain.then(() => api('/api/home')).then(data => { penEl.textContent=data.pen; pointerEl.textContent='home'; }).catch(err => pointerEl.textContent=err.message); };
    document.querySelector('#clear').onclick = () => ctx.clearRect(0,0,canvas.width,canvas.height);
    document.querySelector('#refresh-devices').onclick = loadDevices;
    window.addEventListener('blur', () => { if (drawing) { drawing=false; api('/api/pen-up').catch(()=>{}); } });
    loadDevices();
  </script>
</body>
</html>
